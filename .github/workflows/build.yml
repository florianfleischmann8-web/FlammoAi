name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Paper API and Build JAR
      run: |
        mkdir -p build/de/flamosmp/ai
        
        # Paper API & Gson herunterladen
        wget -q -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.20.1/builds/196/downloads/paper-1.20.1-196.jar || true
        wget -q -O gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar

        # Java-Datei auffinden und kompilieren
        JAVA_FILE=$(find . -name "FlammoAI.java" -o -name "FlamoAI.java" | head -n 1)
        javac -cp "paper.jar:gson.jar" -d build "$JAVA_FILE"

        # Manifest & Ressourcen vorbereiten
        cat << 'EOF' > plugin.yml
name: FlamoAI
main: de.flamosmp.ai.FlammoAI
version: 1.0.0
api-version: '1.20'
author: Flamo SMP
description: KI-Assistent (Ollama) fuer Flamo SMP
commands:
  ai:
    description: Oeffnet den KI-Assistenten oder stellt direkt eine Frage
    usage: /ai [frage]
    permission: flamoai.use
permissions:
  flamoai.use:
    description: Darf den KI-Assistenten nutzen
    default: true
  flamoai.admin:
    description: Darf Koordinaten und Block-Scans erfragen
    default: op
EOF

        cat << 'EOF' > config.yml
ollama-url: "http://localhost:11434/api/chat"
model: "qwen2.5:7b"
timeout-seconds: 120
cooldown-seconds: 3
scan-radius: 16
disclaimer-seen: []
EOF

        cp plugin.yml build/
        cp config.yml build/

        # Fertiges JAR erstellen
        cd build
        jar -cf ../FlamoAI.jar .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlamoAI
        path: FlamoAI.jar
